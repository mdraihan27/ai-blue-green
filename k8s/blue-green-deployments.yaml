apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-ai-agent-blue
  labels:
    app: autonomous-ai-agent
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autonomous-ai-agent
      slot: blue
  template:
    metadata:
      labels:
        app: autonomous-ai-agent
        slot: blue
    spec:
      containers:
        - name: ai-agent
          image: autonomous-ai-agent:stable-blue
          ports:
            - containerPort: 8000
          env:
            - name: DEPLOYMENT_SLOT
              value: "BLUE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-ai-agent-green
  labels:
    app: autonomous-ai-agent
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autonomous-ai-agent
      slot: green
  template:
    metadata:
      labels:
        app: autonomous-ai-agent
        slot: green
    spec:
      containers:
        - name: ai-agent
          image: autonomous-ai-agent:candidate-green
          ports:
            - containerPort: 8000
          env:
            - name: DEPLOYMENT_SLOT
              value: "GREEN"
---
apiVersion: v1
kind: Service
metadata:
  name: autonomous-ai-agent-router
spec:
  selector:
    app: autonomous-ai-agent
    slot: blue
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000


version: "3.9"

services:
  ai-agent-blue:
    build: .
    container_name: ai-agent-blue
    environment:
      - DEPLOYMENT_SLOT=BLUE
      - AGENT_VERSION=1.0.0
    command: ["status"]

  ai-agent-green:
    build: .
    container_name: ai-agent-green
    environment:
      - DEPLOYMENT_SLOT=GREEN
      - AGENT_VERSION=1.1.0
    command: ["test-folder", "/app/examples/safe_banking_agent", "--deploy"]

  prometheus:
    image: prom/prometheus:latest
    container_name: agent-sec-prometheus
    volumes:
      - ./k8s/prometheus-config.yaml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: agent-sec-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

